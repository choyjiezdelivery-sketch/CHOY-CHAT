<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CHOY-CHAT</title>
<meta name="description" content="CHOY-CHAT — newsfeed, messages, groups, friends, live GPS and video calls." />
<meta name="theme-color" content="#0b0d12" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- ==================== AUTH ==================== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand brand-lg">
      <span class="brand-mark">C</span>
      <span class="brand-name">CHOY<span>CHAT</span></span>
    </div>
    <p class="auth-tagline">Share moments. Follow people. Talk about it.</p>

    <div class="tabs" id="auth-tabs">
      <button class="tab active" data-auth-tab="login" type="button">Sign in</button>
      <button class="tab" data-auth-tab="register" type="button">Create account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Username or email
        <input name="identifier" type="text" autocomplete="username" required placeholder="choy" />
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </label>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <label>Username
        <input name="username" type="text" autocomplete="username" required placeholder="choy" pattern="[a-zA-Z0-9_]{3,20}" />
      </label>
      <label>Display name
        <input name="displayName" type="text" placeholder="Choy" />
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
      </label>
      <button class="btn primary block" type="submit">Create account</button>
    </form>

    <p id="auth-error" class="error hidden"></p>
    <p class="auth-demo">Demo account: <code>choy</code> / <code>password123</code></p>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <button class="icon-btn" id="nav-toggle" aria-label="Menu">☰</button>
    <a class="brand" href="#/feed">
      <span class="brand-mark">C</span>
      <span class="brand-name">CHOY<span>CHAT</span></span>
    </a>
    <form class="searchbar" id="global-search">
      <input id="search-input" type="search" placeholder="Search people and posts…" autocomplete="off" />
    </form>
    <div class="topbar-actions">
      <span class="pill offline" id="live-pill" title="Realtime connection">Offline</span>
      <button class="icon-btn" id="notif-btn" title="Notifications">
        🔔<span class="badge hidden" id="notif-badge">0</span>
      </button>
      <button class="avatar-btn" id="me-btn" title="My profile">
        <span id="me-avatar" class="avatar sm">?</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="side-user">
        <span id="side-avatar" class="avatar sm">?</span>
        <div class="side-user-text">
          <strong id="side-name">—</strong>
          <div id="side-handle" class="muted small">@—</div>
        </div>
      </div>

      <a class="nav-item" href="#/feed" data-nav="feed"><span>🏠</span> Newsfeed</a>
      <a class="nav-item" href="#/messages" data-nav="messages"><span>✉️</span> Messages<span class="badge hidden" id="msg-badge">0</span></a>
      <a class="nav-item" href="#/groups" data-nav="groups"><span>👥</span> Groups</a>
      <a class="nav-item" href="#/friends" data-nav="friends"><span>🤝</span> Friends<span class="badge hidden" id="friend-badge">0</span></a>
      <a class="nav-item" href="#/gps" data-nav="gps"><span>📍</span> Live GPS</a>
      <a class="nav-item" href="#/video" data-nav="video"><span>🎥</span> Video</a>
      <a class="nav-item" href="#/profile" data-nav="profile"><span>👤</span> Profile</a>
      <a class="nav-item" href="#/settings" data-nav="settings"><span>⚙️</span> Settings</a>
      <a class="nav-item admin-only hidden" href="#/admin" data-nav="admin"><span>🛡️</span> Admin</a>

      <button class="nav-item nav-logout" id="logout-btn" type="button"><span>↩</span> Sign out</button>
    </nav>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- ==================== MODAL ==================== -->
<div id="modal-root" class="modal-root hidden">
  <div id="modal-body" class="modal"></div>
</div>

<!-- ==================== TOASTS ==================== -->
<div id="toasts" class="toasts"></div>

<!-- ==================== CALL OVERLAY ==================== -->
<div id="call-overlay" class="call-overlay hidden">
  <div class="call-card">
    <div id="call-avatar" class="avatar xl">?</div>
    <h2 id="call-name">—</h2>
    <p id="call-status" class="muted">Connecting…</p>

    <div class="call-videos">
      <video id="call-remote" autoplay playsinline></video>
      <video id="call-local" autoplay playsinline muted></video>
    </div>

    <div class="call-actions">
      <button class="btn ghost" id="call-mute" type="button">🎙️ Mute</button>
      <button class="btn ghost" id="call-cam" type="button">📷 Camera</button>
      <button class="btn danger" id="call-hangup" type="button">End call</button>
    </div>
  </div>
</div>

<script src="/realtime.js"></script>
<script src="/app.js"></script>
</body>
</html>
